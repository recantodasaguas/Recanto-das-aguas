<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Associação de Moradores do Recanto das Águas</title>
<style>
:root {
  --site-primary: #174c39;
  --site-on-primary: #ffffff;
  --site-secondary: #245b83;
  --site-on-secondary: #ffffff;
  --site-background: #f7faf8;
  --site-on-background: #1e3029;
  --site-font-body: Arial, Helvetica, sans-serif;
  --site-font-heading: Georgia, 'Times New Roman', serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  --surface: light-dark(#ffffff, #17211d);
  --surface-soft: light-dark(#eef4f0, #202e28);
  --text-muted: light-dark(#52665c, #bdccc3);
  --border-color: light-dark(#d6e2da, #3c4c43);
  color-scheme: light dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); line-height: 1.6; }
#site-root { min-height: 100vh; width: 100%; border-radius: 0; background-color: var(--site-background); color: var(--site-on-background); }
button, a { font: inherit; }
a { color: var(--site-secondary); }
.site-header { background: var(--surface); border-bottom: 1px solid var(--border-color); }
.topline { height: 7px; background: linear-gradient(90deg, var(--site-primary) 0 68%, var(--site-secondary) 68% 100%); }
.header-inner { max-width: 1160px; margin: auto; padding: calc(16px * var(--site-spacing-scale)) calc(24px * var(--site-spacing-scale)); display: flex; align-items: center; gap: 20px; }
.logo { width: 122px; height: 105px; object-fit: contain; flex-shrink: 0; }
.brand-name { color: var(--site-primary); font-family: var(--site-font-heading); font-size: calc(1.35rem * var(--site-heading-scale)); font-weight: 700; line-height: 1.2; }
.brand-sub { color: var(--text-muted); margin-top: 7px; font-size: .9rem; letter-spacing: .08em; }
.nav-wrap { background: var(--site-primary); color: var(--site-on-primary); }
nav { max-width: 1160px; margin: auto; display: flex; flex-wrap: wrap; padding: 0 16px; }
nav button { border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--site-on-primary); padding: 14px 13px; cursor: pointer; font-size: .92rem; }
nav button:hover, nav button.active { background: color-mix(in srgb, var(--site-on-primary) 12%, transparent); border-bottom-color: #d7e9b6; }
.hero { background: linear-gradient(110deg, color-mix(in srgb, var(--site-primary) 95%, #0b2a20), var(--site-secondary)); color: white; position: relative; overflow: hidden; }
.hero::after { content: ''; position: absolute; width: 380px; height: 380px; border: 1px solid rgba(255,255,255,.17); border-radius: 50%; right: -80px; top: -190px; box-shadow: 0 0 0 35px rgba(255,255,255,.04), 0 0 0 75px rgba(255,255,255,.03); opacity: var(--site-decoration-opacity); pointer-events: none; }
.hero-inner { max-width: 1160px; margin: auto; padding: calc(62px * var(--site-spacing-scale)) 24px; position: relative; z-index: 1; }
.eyebrow { text-transform: uppercase; font-size: .78rem; letter-spacing: .16em; font-weight: 700; color: #d7e9b6; }
h1,h2,h3 { font-family: var(--site-font-heading); line-height: 1.22; }
h1 { font-size: clamp(2.1rem, 5vw, calc(3.45rem * var(--site-heading-scale))); max-width: 760px; margin: 12px 0 18px; }
.hero p { max-width: 700px; font-size: 1.08rem; color: #eef5f0; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: calc(7px * var(--site-radius-scale)); padding: 11px 17px; border: 1px solid transparent; cursor: pointer; text-decoration: none; font-weight: 700; }
.btn-light { background: white; color: var(--site-primary); }
.btn-outline { color: white; border-color: rgba(255,255,255,.65); background: transparent; }
main { max-width: 1160px; margin: auto; padding: calc(38px * var(--site-spacing-scale)) 24px 64px; }
.page { display: none; animation: fadein .18s ease-out; }
.page.active { display: block; }
@keyframes fadein { from {opacity:.5; transform:translateY(4px)} to {opacity:1;transform:none} }
.section-kicker { color: var(--site-secondary); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
h2 { color: var(--site-primary); font-size: calc(2rem * var(--site-heading-scale)); margin: 8px 0 14px; }
.lead { font-size: 1.08rem; color: var(--text-muted); max-width: 820px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 18px; margin-top: 28px; }
.card { background: var(--surface); border: 1px solid var(--border-color); border-radius: calc(12px * var(--site-radius-scale)); padding: 23px; box-shadow: 0 5px 18px rgba(23,76,57,.045); }
.card .icon { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 10px; color: var(--site-primary); background: var(--surface-soft); font-size: 1.35rem; }
.card h3 { font-size: 1.25rem; margin: 14px 0 8px; color: var(--site-primary); }
.card p { margin: 0; color: var(--text-muted); }
.notice { border-left: 4px solid var(--site-secondary); background: var(--surface-soft); padding: 17px 20px; margin-top: 25px; border-radius: 0 8px 8px 0; }
.two-col { display: grid; grid-template-columns: 1.1fr .9fr; gap: 28px; align-items: start; }
.list { padding-left: 22px; }
.list li { margin: 8px 0; }
.doc-list { display: grid; gap: 12px; margin-top: 24px; }
.doc-item { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border-color); border-radius: 9px; padding: 16px; }
.doc-item .doc-icon { font-size: 1.45rem; }
.doc-item strong { display: block; color: var(--site-primary); }
.doc-item small { display: block; color: var(--text-muted); margin-top: 3px; }
.pill { display: inline-block; font-size: .75rem; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: var(--surface-soft); color: var(--site-primary); margin-left: auto; }
form { display: grid; gap: 14px; max-width: 720px; margin-top: 24px; }
label { font-weight: 700; display: grid; gap: 6px; }
input, select, textarea { width: 100%; border: 1px solid var(--border-color); border-radius: 7px; padding: 11px 12px; color: var(--site-on-background); background: var(--surface); }
textarea { min-height: 120px; resize: vertical; }
.form-note { font-size: .88rem; color: var(--text-muted); }
footer { background: #112f25; color: #e9f2ec; padding: 30px 24px; }
.footer-inner { max-width: 1160px; margin: auto; display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
footer p { margin: 5px 0; color: #c6d9cd; font-size: .9rem; }
footer .footer-title { font-weight: 700; letter-spacing: .03em; }
@media (max-width: 760px) {
 .header-inner { padding: 13px 16px; gap: 12px; }
 .logo { width: 85px; height: 78px; }
 .brand-name { font-size: 1.05rem; }
 .brand-sub { font-size: .75rem; }
 nav { padding: 5px 8px; }
 nav button { padding: 10px 9px; font-size: .82rem; }
 .hero-inner { padding: 44px 20px; }
 main { padding: 30px 18px 48px; }
 .cards, .two-col { grid-template-columns: 1fr; }
 .pill { display: none; }
}
</style>
</head>
